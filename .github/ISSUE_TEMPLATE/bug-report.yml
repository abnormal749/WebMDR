name: Bug report
description: Something on the page didn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a failed reconnect after switching the headphones off and on, see the
        [known issue](https://github.com/abnormal749/WebMDR#known-issues-and-limitations): quitting and reopening Chrome is the current workaround.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect
        2. Choose Ambient sound
        3. ...
  - type: input
    id: model
    attributes:
      label: Headphone model and firmware
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and browser, exact versions
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: WebMDR build (page footer) and origin
  - type: textarea
    id: log
    attributes:
      label: Protocol log
      description: From the Advanced panel. Please check it for anything personal before posting.
      render: text
